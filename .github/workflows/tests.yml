# The suite is the merge gate: every PR the agent team opens runs it, and
# branch protection can require this check before any merge.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
